name: Deploy WEBCORE to GitHub Pages

on:
  push:
    branches: [claude/festive-maxwell-mGxPS]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: claude/festive-maxwell-mGxPS

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build static export
        run: |
          cat > next.config.js << 'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            basePath: '/skywoksweb',
            assetPrefix: '/skywoksweb',
            reactStrictMode: false,
            images: { unoptimized: true },
            experimental: {
              optimizePackageImports: ['framer-motion', 'gsap'],
            },
          };
          module.exports = nextConfig;
          EOF
          npm run build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages
          clean: true

      - name: Switch Pages source to gh-pages branch
        continue-on-error: true
        run: |
          curl -s -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source": {"branch": "gh-pages", "path": "/"}}'
          echo "Pages source update attempted"
